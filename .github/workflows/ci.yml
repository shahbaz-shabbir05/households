name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real Postgres. SQLite would diverge on
      # exactly the features this schema relies on — partial indexes,
      # timestamptz, advisory locks (docs/12).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://hms:hms@localhost:5432/hms_test
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      COOKIE_SECURE: 'false'
      JOBS_ENABLED: 'false'
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck first: it is the fastest signal and catches contract drift
      # between the API and the web client.
      - name: Typecheck
        run: npm run typecheck

      - name: Migrate the test database
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
